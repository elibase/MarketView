            <div class="grid-container">
                <div class="grid-container-item">
                    <form action="/submit-news-keyword" method="POST">
                        <div class="search">
                            <input type="text" id="news-keyword" name="news-keyword"
                                placeholder="Enter Keyword...">
                        </div>
                        <button class="btn" type="submit">Add Keyword</button>
                    </form>
                </div>
                <div class="grid-container-item">
                    <p>Keywords</p>
                    <div class="table-scroller">
                        <table class="keyword-table">
                            <tr>
                                <th></th>
                                <th></th>
                            </tr>
                            <tr>
                                <form action="/remove-news-keyword" method="POST">
                                    <td>AMZN</td>
                                    <td><button class="btn" type="submit">Remove</button></td>
                                </form>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="column-span">
                    <button class="btn" id="gatherArticlesButton">Gather Articles</button>
                    <hr>
                </div>

                <div class="column-span">
                    <div class="table-scroller">
                        <table id="articleTable" class="article-table">
                            <thead>
                                <tr>
                                    <th>Keyword</th>
                                    <th>Article</th>
                                    <th>Publisher</th>
                                    <th>Publish Date</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="articleTableBody">
